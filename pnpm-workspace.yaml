packages:
  - 'apps/*'
  - 'packages/*'
  - 'evals'
allowBuilds:
  core-js: true
  core-js-pure: true
  esbuild: true
minimumReleaseAgeExclude:
  - jsforce@3.10.29
overrides:
  vite: '>=6.4.3'
  # Patched versions of transitive dependencies flagged by `pnpm audit`.
  proxy-addr: '^2.0.8'
  sharp: '^0.35.5'
  source-map-js: '^1.2.2'
  undici: '^8.10.2'
  csv-parse: '^7.0.2'
  fast-uri: '^3.1.8'
  hono: '^4.13.7'
  ip-address: '^10.7.1'
  dompurify: '^3.4.16'
  tinypool: '^2.1.2'
